<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#08070c">
<title>Godrank</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Godrank">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&family=Noto+Serif+JP:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#030304;--bg2:#0d0b13;--card:rgba(16,14,22,.66);--card2:rgba(26,23,35,.74);--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
  --text:#f4f2f8;--muted:#9a95ab;--dim:#625d73;--accent:#7cc4ff;--accent2:#4f8dff;--gold:#e9c46a;--good:#4fe0b5;--bad:#ff5a72;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#050408}
body{color:var(--text);font-family:Figtree,system-ui,sans-serif;display:grid;place-items:center;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
input,select{font:inherit;color:inherit}
.jp{font-family:"Noto Serif JP",serif}
.device{position:relative;width:390px;height:844px;max-height:100vh;background:#030304;border-radius:44px;border:1px solid #26222f;overflow:hidden;box-shadow:0 40px 120px rgba(0,0,0,.8)}
@media(max-width:480px){.device{width:100vw;height:100dvh;max-height:none;border:0;border-radius:0}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:max(14px,var(--st))}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.body{flex:1;overflow-y:auto;padding:4px 18px 24px;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.h1{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.h2{font-size:20px;font-weight:800;letter-spacing:-.01em}
.h3{font-size:16px;font-weight:700}
.muted{color:var(--muted)}.dim{color:var(--dim)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.card{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015)),var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:12px;font-weight:700;color:#d8d4e4}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-weight:700;font-size:13px;color:#cfcade}
.chip.on{background:var(--text);color:#0b0a10;border-color:transparent}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:3px}
.seg button{flex:1;padding:9px;border-radius:11px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--text);color:#0b0a10}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border-radius:16px;font-weight:800;font-size:16px;letter-spacing:.01em;
  background:linear-gradient(135deg,#9ad3ff,#5b8dff);color:#07101f;box-shadow:0 8px 24px -8px rgba(91,141,255,.7),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn:disabled{background:var(--card2);color:var(--dim);box-shadow:none}
.btn.ghost{background:var(--card2);color:var(--text);box-shadow:none;border:1px solid var(--line2)}
.btn.sm{padding:11px 14px;font-size:14px;border-radius:13px;width:auto}
.ibtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--card2);border:1px solid var(--line);color:#d8d4e4;flex:none}
.ibtn.on{background:var(--text);color:#0b0a10}
.tabbar{display:flex;justify-content:space-around;padding:14px 6px calc(10px + var(--sb));background:linear-gradient(180deg,rgba(3,3,4,0),rgba(3,3,4,.55) 45%,rgba(3,3,4,.7));border:0}
.tabbar button{text-shadow:0 1px 6px #000}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--dim);width:72px;padding:4px 0}
.tabbar button.on{color:var(--text)}
.tabbar button.on svg{stroke:var(--accent)}
.top{display:flex;align-items:center;justify-content:space-between;padding:8px 18px 12px}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:linear-gradient(135deg,#2a2440,#1a1626);border:1px solid var(--line2);flex:none}
.coach{display:flex;gap:12px;align-items:flex-start}
.coach img{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid rgba(124,196,255,.5);flex:none;box-shadow:0 0 0 4px rgba(124,196,255,.08)}
.bubble{position:relative;background:var(--card2);border:1px solid var(--line2);border-radius:16px;border-top-left-radius:4px;padding:10px 13px;font-size:14px;font-weight:600;line-height:1.35}
.bubble b{color:var(--accent)}
.coach.sm img{width:34px;height:34px;border-width:1.5px}
.coach.sm .bubble{font-size:13px;padding:8px 11px}
.ex{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--card2);border:1px solid var(--line);margin-bottom:8px;width:100%;text-align:left}
.ex .t{flex:1;min-width:0}.ex .t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex .t small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.tag{font-size:11px;font-weight:800;letter-spacing:.04em;padding:3px 8px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted);flex:none}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:14px;border:1px solid var(--line);background:var(--card2);font-size:11px;font-weight:700;color:var(--muted)}
.wd b{font-size:15px;color:var(--text)}
.wd i{font-style:normal;font-size:9px;letter-spacing:.06em;text-transform:uppercase}
.wd.train i{color:var(--accent)}
.wd.done{background:linear-gradient(160deg,rgba(79,224,181,.18),rgba(79,224,181,.05));border-color:rgba(79,224,181,.35)}
.wd.done i{color:var(--good)}
.wd.sel{outline:2px solid var(--text);outline-offset:-2px}
.wd.rest{opacity:.55}
.set{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:8px;align-items:center;margin-top:8px}
.set .n{font-weight:800;color:var(--dim);text-align:center;font-size:13px}
.set input{width:100%;background:#0c0a12;border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center;font-weight:800;font-size:17px;outline:0}
.set input:focus{border-color:var(--accent)}
.set .ok{height:44px;border-radius:12px;background:#0c0a12;border:1px solid var(--line);display:grid;place-items:center;color:var(--dim)}
.set.done input{background:rgba(79,224,181,.08);border-color:rgba(79,224,181,.3)}
.set.done .ok{background:var(--good);color:#04241a;border-color:transparent}
.sethead{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:8px;font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--dim);text-align:center;margin-top:12px}
.hint{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;padding:8px 10px;border-radius:12px;background:#0c0a12;border:1px solid var(--line);margin-top:10px}
.modal{position:absolute;inset:0;background:rgba(3,2,6,.7);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:45;display:flex;align-items:flex-end;animation:fade .2s}
.sheet{background:var(--bg2);border-top:1px solid var(--line2);border-radius:26px 26px 0 0;padding:18px 18px calc(22px + var(--sb));width:100%;max-height:88%;overflow-y:auto}
.grab{width:40px;height:5px;border-radius:3px;background:#3a3450;margin:-6px auto 14px}
.toast{position:absolute;left:18px;right:18px;bottom:calc(96px + var(--sb));background:#1a1724;border:1px solid var(--line2);border-radius:16px;padding:12px 14px;font-weight:700;font-size:14px;z-index:60;animation:fade .2s;box-shadow:0 10px 30px rgba(0,0,0,.5);display:flex;align-items:center;gap:8px}
.reveal{position:absolute;inset:0;background:rgba(4,3,8,.94);z-index:50;display:flex;flex-direction:column;align-items:center;padding:calc(44px + var(--st)) 20px calc(24px + var(--sb));text-align:center;animation:fade .3s;overflow:hidden}
.reveal .rays{position:absolute;left:50%;top:42%;width:900px;height:900px;margin:-450px 0 0 -450px;background:repeating-conic-gradient(from 0deg,var(--c) 0 6deg,transparent 6deg 22deg);opacity:.16;-webkit-mask-image:radial-gradient(circle,#000 0,transparent 55%);mask-image:radial-gradient(circle,#000 0,transparent 55%);animation:spin 20s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.reveal .rn{font-size:38px;font-weight:900;letter-spacing:.01em;color:var(--c);position:relative;line-height:1.1;margin-top:4px}
.reveal .mid{position:relative;flex:1;display:grid;place-items:center}
.reveal .mid .gfx{animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.15);opacity:0}}
.field{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.field label{flex:1;font-weight:700;font-size:14px;color:#d8d4e4}
.field input,.field select{width:120px;background:transparent;border:0;outline:0;text-align:right;font-weight:800;font-size:17px;color:var(--text)}
.field select{width:auto}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--card);margin-bottom:10px}
.opt.on{border-color:var(--accent);background:linear-gradient(180deg,rgba(124,196,255,.12),rgba(124,196,255,.03)),var(--card)}
.opt b{display:block;font-size:16px}.opt small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.prog{height:4px;border-radius:2px;background:var(--card2);overflow:hidden;margin:6px 18px 0}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#9ad3ff,#5b8dff);transition:width .3s}
.bar{height:8px;border-radius:4px;background:#0c0a12;overflow:hidden}.bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#9ad3ff,#5b8dff)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal .h{font-size:10px;color:var(--dim);font-weight:800;letter-spacing:.08em}
.cal .d{aspect-ratio:1;border-radius:11px;background:var(--card2);display:grid;place-items:center;font-size:12px;font-weight:700;color:#bdb8cc;border:1px solid transparent}
.cal .d.done{background:linear-gradient(160deg,rgba(79,224,181,.3),rgba(79,224,181,.08));color:#fff;border-color:rgba(79,224,181,.4)}
.cal .d.plan{border-color:rgba(124,196,255,.45);color:var(--accent)}
.cal .d.today{outline:1.5px solid var(--text)}
.cal .d.x{opacity:0}
.gnav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.gnav button{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:13px;position:relative}
.gnav .dot{position:absolute;top:10px;right:10px;background:var(--bad);color:#fff;border-radius:999px;font-size:10px;font-weight:900;min-width:18px;height:18px;display:grid;place-items:center}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;justify-items:center}
.medal{width:96px;text-align:center;font-size:11px;font-weight:700;color:#d8d4e4}
.oc{margin:0 auto 6px;clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);display:grid;place-items:center;color:#fff}
.medal.lock{color:var(--dim)}.medal.lock .oc{filter:grayscale(1) brightness(.35)}
.seat{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--card2);border:1px solid var(--line);margin-bottom:6px}
.seat .p{width:20px;font-weight:900;text-align:center;color:var(--dim)}
.seat .k{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);flex:none}
.seat .w{flex:1;min-width:0}.seat .w b{display:block;font-size:14px}.seat .w span{font-size:12px;color:var(--muted)}
.mon{position:relative;width:240px;height:240px;margin:4px auto 14px}
.mon .st{position:absolute;inset:27%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#2b2440,#140f20 70%);display:grid;place-items:center;font-family:"Noto Serif JP",serif;font-size:52px;font-weight:900;color:#e9f9ff;text-shadow:0 0 24px rgba(127,227,255,.6)}
.mon .m{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--c);color:var(--c);background:var(--card2)}
.lb{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--card2);border:1px solid var(--line);margin-bottom:6px}
.lb.me{border-color:var(--accent)}
.zone{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;text-align:center;padding:6px;border-radius:8px;margin:8px 0}
.zone.up{color:var(--good);background:rgba(79,224,181,.08)}.zone.down{color:var(--bad);background:rgba(255,90,114,.08)}
.legend{display:flex;flex-wrap:wrap;gap:6px 10px;justify-content:center;font-size:10.5px;font-weight:700;color:#cfcade}
.legend span{display:flex;align-items:center;gap:4px}.legend i{width:8px;height:8px;border-radius:50%}
.fcoach{position:absolute;right:12px;bottom:calc(86px + var(--sb));z-index:30;display:flex;align-items:flex-end;gap:8px;cursor:pointer;animation:fcin .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes fcin{from{opacity:0;transform:translateY(24px) scale(.9)}}
.fcoach.wk{bottom:calc(16px + var(--sb))}
.fcoach .av{position:relative;width:60px;height:60px;border-radius:50%;flex:none}
.fcoach .av img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid rgba(124,196,255,.85);position:relative;z-index:1}
.fcoach .av:before{content:"";position:absolute;inset:-6px;border-radius:50%;background:radial-gradient(circle,rgba(124,196,255,.55),transparent 70%);animation:pulse 2.4s ease-in-out infinite}
.fcoach .fb{pointer-events:auto;max-width:236px;background:rgba(26,23,36,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(124,196,255,.35);border-radius:18px;border-bottom-right-radius:4px;padding:11px 13px;font-size:13.5px;font-weight:600;line-height:1.35;box-shadow:0 12px 30px rgba(0,0,0,.5),0 0 20px -8px #7cc4ff;animation:fbin .35s cubic-bezier(.2,1.4,.4,1);margin-bottom:22px}
.fcoach .fb b{color:var(--accent)}
.fcoach .fb .nm{display:block;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulse{0%,100%{opacity:.4;transform:scale(.95)}50%{opacity:1;transform:scale(1.08)}}
@keyframes fbin{from{opacity:0;transform:translateY(10px) scale(.9)}}
.flame{color:#ff8a3d;filter:drop-shadow(0 0 6px #ff8a3d)}
.sweek{display:flex;justify-content:space-between;margin:12px 0}
.sweek div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:800;color:var(--dim)}
.sweek i{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-style:normal;background:#1a1724;border:1px solid var(--line)}
.sweek .on i{background:radial-gradient(circle at 40% 35%,#ffb24a,#ff6a1f);border:0;box-shadow:0 0 12px #ff8a3d99;color:#2a1000}
.sweek .td{color:#ff8a3d}
.wheelbox{position:relative;margin-top:10px}
.wheelbox .wl{position:absolute;left:8px;top:6px;font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--dim)}
.wheelbox .wv{text-align:center;font-weight:800}.wheelbox .wv b{font-size:34px;letter-spacing:-.02em}.wheelbox .wv span{font-size:15px;margin-left:4px;color:var(--muted)}
.wheel{height:54px;overflow-x:scroll;scrollbar-width:none;margin:2px -10px 0;cursor:grab;-webkit-mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent)}
.wheel::-webkit-scrollbar{display:none}
.wt{height:100%;background:repeating-linear-gradient(90deg,#4a4560 0 2px,transparent 2px 12px) 0 22px/100% 20px no-repeat,repeating-linear-gradient(90deg,#8a85a0 0 2px,transparent 2px 60px) 0 10px/100% 32px no-repeat;background-origin:content-box;padding:0 50%;box-sizing:content-box}
.wneedle{position:absolute;left:50%;bottom:4px;width:3px;height:44px;margin-left:-1.5px;border-radius:2px;background:var(--accent);box-shadow:0 0 10px var(--accent);pointer-events:none}
.voidbg{position:absolute;inset:0;width:100%;height:100%;z-index:0;transition:opacity .4s}
#root{position:absolute;inset:0;z-index:1}
.sheet{background:#0d0b13}
.card{backdrop-filter:none}
.reveal.dim{background:rgba(0,0,0,0);animation:none}
.reveal.dim.go{background:rgba(2,2,4,.96);transition:background .35s}
.reveal .stage{position:absolute;inset:0;display:grid;place-items:center;z-index:6;pointer-events:none}
.mhex{width:150px;height:172px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(160deg,#f2fbff,#a8dcff 55%,#5b8dff);display:grid;place-items:center;font-size:96px;font-weight:900;color:#203a66;
  animation:mIn .35s cubic-bezier(.2,1.5,.4,1) both,mCharge 1.35s .35s cubic-bezier(.5,0,.9,.4) forwards}
.mglow{position:absolute;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(160,215,255,.55),transparent 65%);animation:mGlow 1.7s ease-in forwards}
.mflash{position:absolute;inset:-20%;background:radial-gradient(circle,#fff 0,rgba(255,255,255,.85) 18%,rgba(255,255,255,0) 60%);opacity:0;animation:mFlash .55s 1.6s ease-out forwards}
@keyframes mIn{from{transform:scale(.2);opacity:0}}
@keyframes mCharge{0%{transform:scale(1)}55%{transform:scale(.74)}62%{transform:scale(.75) rotate(-5deg)}69%{transform:scale(.72) rotate(5deg)}76%{transform:scale(.7) rotate(-4deg)}83%{transform:scale(.68) rotate(4deg)}100%{transform:scale(.6);filter:brightness(3.2) drop-shadow(0 0 40px #fff)}}
@keyframes mGlow{0%{transform:scale(.6);opacity:.4}100%{transform:scale(1.5);opacity:1}}
@keyframes mFlash{0%{opacity:0;transform:scale(.4)}25%{opacity:1}100%{opacity:0;transform:scale(1.6)}}
.reveal .card-in{opacity:0}
.reveal.shown .card-in{opacity:1;transition:opacity .35s}
.reveal.shown .pop{animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.reveal.shown .slide{animation:slideIn .45s cubic-bezier(.2,1.2,.4,1) both}
@keyframes slideIn{from{opacity:0;transform:translateY(-14px)}}
.btn .spin{width:18px;height:18px;border:2.5px solid rgba(7,16,31,.25);border-top-color:#07101f;border-radius:50%;animation:spin .7s linear infinite}

<script>
/* ================= state ================= */
const DEF={setup:false,step:0,name:'',sex:'m',heightFt:5,heightIn:8,bw:165,age:25,goal:'lean',target:150,exp:'int',days:[1,2,4,5],loc:'gym',
  lifts:{},history:[],sessions:[],last:{},splitIdx:0,plans:{},active:null,
  health:[],goals:[],claimed:{},questsDone:0,xp:0,level:1,claimedLv:1,gems:0,prs:0,seat:null,seatTitle:'',tab:'home'};
let S=load();
function load(){const d=JSON.parse(JSON.stringify(DEF));try{return Object.assign(d,JSON.parse(localStorage.getItem('godrank2')||'{}'))}catch(e){return d}}
function save(){try{localStorage.setItem('godrank2',JSON.stringify(S))}catch(e){}window.syncReminderState&&syncReminderState()}
const $=s=>document.querySelector(s), root=document.getElementById('root'), dev=document.getElementById('dev');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const U=()=>({bw:+S.bw||165,sex:S.sex,goal:S.goal,exp:S.exp,days:S.days});
const DAYMS=864e5, sod=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()}, dkey=t=>{const d=new Date(t);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const addDays=(t,n)=>{const d=new Date(t);d.setDate(d.getDate()+n);return sod(d)};
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

/* ================= icons (line style) ================= */
const IC={home:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
 plan:'<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/>',
 trophy:'<path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 21h8M9 17h6"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>',
 dice:'<rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8" cy="8" r="1.3" fill="currentColor"/><circle cx="16" cy="16" r="1.3" fill="currentColor"/><circle cx="16" cy="8" r="1.3" fill="currentColor"/><circle cx="8" cy="16" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/>',
 lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
 unlock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/>',
 swap:'<path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/>',
 info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>',
 check:'<path d="M5 12.5l4.5 4.5L19 7"/>', plus:'<path d="M12 5v14M5 12h14"/>', x:'<path d="M6 6l12 12M18 6L6 18"/>',
 left:'<path d="M15 5l-7 7 7 7"/>', right:'<path d="M9 5l7 7-7 7"/>',
 flame:'<path d="M12 3c1 4 5 5.5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-4 2.5-5 .3 2 1.5 3 2.5 3-1-3 0-6 0-8z"/>',
 target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
 heart:'<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/>',
 award:'<circle cx="12" cy="9" r="6"/><path d="M8.5 14L7 21l5-3 5 3-1.5-7"/>',
 scroll:'<path d="M7 4h11a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H7"/><path d="M7 4a2 2 0 0 0-2 2v2h4V6a2 2 0 0 0-2-2zM9 9h8M9 13h8M9 17h5"/>',
 dumbbell:'<path d="M3 10v4M6 7v10M18 7v10M21 10v4M6 12h12"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
 download:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>', upload:'<path d="M12 20V9M7 14l5-5 5 5M5 4h14"/>',
 play:'<path d="M8 5l11 7-11 7z" fill="currentColor"/>', scale:'<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M9 9a4 4 0 0 1 6 0l-2 3"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>', spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>',
 trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>', cal:'<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4M8 13h2M12 13h2M16 13h1M8 17h2M12 17h2"/>',
 bolt:'<path d="M13 3L5 13h6l-1 8 8-10h-6z"/>', crown:'<path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/>', layers:'<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>'};
const I=(n,s=20)=>`<svg class="i" viewBox="0 0 24 24" style="width:${s}px;height:${s}px">${IC[n]||''}</svg>`;

/* ================= derived data ================= */
const COACH_IMG='assets/rudeus.jpg';
const overall=()=>{const v=Object.values(S.lifts).map(l=>l.rating);return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):0};
const bestRating=()=>Math.max(0,...Object.values(S.lifts).map(l=>l.rating));
const topPct=r=>Math.max(.01,100*Math.pow(1-r/1000,1.6)).toFixed(1);
const BACKSUB=new Set(['lats','upperback','lowerback']);
const musList=(e,m)=>BACKSUB.has(m)?(e.sub||[]):e.m;
function muscleRating(m){return muscleBest(m)[1]}
/* ================= rank guide: what each god rank takes, at your bodyweight ================= */
const GUIDE_EX=['barbell-bench-press','back-squat','deadlift','overhead-press','barbell-row','pull-up','barbell-curl','chest-dip','push-up'];
function rankGuide(){const ids=GUIDE_EX.filter(id=>EXI[id]),id=ids.includes(S._gx)?S._gx:ids[0],e=EXI[id],u=U(),mine=S.lifts[id],myR=mine?rankFor(mine.rating):null;
  const span=r=>(r.hi-r.lo+1)/3,start=(r,d)=>Math.max(1,Math.ceil(r.lo+d*span(r)));
  // what it takes to reach a rating: weight at 1 and 5 reps for lifts, reps for bodyweight moves
  const need=(R,reps)=>{const v=needFor(e,R,reps,u);return e.type==='w'?Math.max(5,Math.ceil(v/5)*5):Math.max(1,Math.ceil(v))};
  const fmt=R=>e.type==='w'?`<b>${need(R,1)} lb</b> × 1 <span class="dim">·</span> <b>${need(R,5)} lb</b> × 5`:e.type==='time'?`<b>${need(R)}s</b>`:`<b>${need(R)}</b> reps`;
  return `<div class="card" style="margin-bottom:12px"><div class="h3">How ranks work</div>
     <p class="muted" style="font-size:13px;line-height:1.5;margin-top:6px">Every lift gets a rating from 1 to 1000, based on the weight, your reps and your bodyweight (${u.bw} lb). Each god rank has three divisions, I, II and III. A muscle's rank is your best lift for it. Your overall rank is the average of all your ranked lifts.</p></div>
   <div class="chips" style="margin:0 0 12px;flex-wrap:wrap">${ids.map(x=>`<button class="chip ${x===id?'on':''}" onclick="S._gx='${x}';render()">${EXI[x].n}</button>`).join('')}</div>
   <p class="dim" style="font-size:12px;margin:0 2px 10px">What it takes to reach each rank on <b>${e.n}</b> at ${u.bw} lb bodyweight.${e.eq==='wb'?' Weight is added on top of your bodyweight.':''}</p>
   ${[...RANKS].reverse().map(r=>{const here=myR&&myR.rank===r;
     return `<div class="card" style="margin-bottom:10px;${here?`border-color:${r.hex};box-shadow:0 0 0 1px ${r.hex}55 inset`:''}">
      <div class="row" style="gap:14px;align-items:center"><div style="width:72px;height:72px;flex:none;display:grid;place-items:center;overflow:hidden;border-radius:16px">${fx(r,60)}</div>
       <div style="flex:1;min-width:0"><div class="between"><b style="font-size:17px;color:${r.hex}">${r.name}</b><span class="jp dim" style="font-size:13px">${r.jp}</span></div>
        <div class="muted" style="font-size:12px;margin-top:2px">${r.desc}</div>
        <div class="dim" style="font-size:11px;margin-top:4px">Rating ${r.lo}–${r.hi} · seat ${r.seat} of 7${here?` · <b style="color:${r.hex}">You're here (${myR.div})</b>`:''}</div></div></div>
      <div style="margin-top:10px;display:grid;gap:6px">${['I','II','III'].map((d,i)=>`<div class="between" style="font-size:13px;background:var(--card2);border-radius:10px;padding:8px 12px"><span class="muted">${r.name.replace(' God','')} ${d}</span><span>${fmt(start(r,i))}</span></div>`).join('')}</div></div>`}).join('')}`}
// every exercise that works any of these muscles
const musExercises=ms=>EXL.filter(e=>ms.some(m=>musList(e,m).includes(m)));
// sheet: all exercises for one muscle, ranked ones first (best rank on top), then main movers, then helpers
function musRank(m,f){S._mf=f||S._mf||'all';const flt=S._mf;
  const all=EXL.filter(e=>musList(e,m).includes(m)).map(e=>{const l=S.lifts[e.id],role=musList(e,m).indexOf(m)===0?0:1;return {e,l,role}});
  all.sort((a,b)=>(b.l?b.l.rating:-1)-(a.l?a.l.rating:-1)||a.role-b.role||(b.e.staple-a.e.staple)||a.e.n.localeCompare(b.e.n));
  const nr=all.filter(x=>x.l).length,list=flt==='ranked'?all.filter(x=>x.l):flt==='main'?all.filter(x=>x.role===0):all;
  const [,r]=muscleBest(m),k=r?rankFor(r):null;
  const chip=(v,l)=>`<button class="pill" style="${flt===v?'background:var(--text);color:#000':''}" onclick="musRank('${m}','${v}')">${l}</button>`;
  sheet(`<div class="between"><div><div class="eyebrow">Muscle ranking</div><div class="h2" style="margin-top:2px">${MUSCLE_NAMES[m]}</div>
      <div class="muted" style="font-size:13px;margin-top:2px">${nr} of ${all.length} exercises ranked</div></div>${k?`<div style="text-align:center">${fx(k.rank,52)}<div style="font-weight:800;font-size:11px;color:${k.rank.hex}">${k.rank.name.toUpperCase()} ${k.div}</div></div>`:''}</div>
    <div class="row" style="gap:6px;margin:12px 0 6px">${chip('all','All '+all.length)}${chip('main','Main movers '+all.filter(x=>!x.role).length)}${chip('ranked','Ranked '+nr)}</div>
    ${list.length?list.map(({e,l,role})=>{const q=l&&rankFor(l.rating);return `<button class="ex" style="width:100%" onclick="exSheet('${e.id}')">${thumb(e,44)}<span class="t" style="flex:1;min-width:0;text-align:left"><b>${e.n}</b><small>${role?'Helps':'Main mover'} · ${e.eqName}${l?` · ${l.w?l.w+' lb × '+l.r:l.r+(e.type==='time'?'s':' reps')}`:''}</small></span>
      ${q?`<span class="row" style="gap:6px">${fx(q.rank,30)}<span style="font-weight:800;font-size:11px;color:${q.rank.hex};text-align:right">${q.rank.name.replace(' God','').toUpperCase()}<br>${q.div}</span></span>`:`<span class="muted" style="font-size:11px;font-weight:700">Unranked</span>`}</button>`}).join('')
      :`<p class="muted" style="margin:16px 0">No ranked exercises yet. Log one in the Calculator.</p>`}`)}
// best lift for a muscle: [exercise id, rating] (secondary muscles count at 85%)
function muscleBest(m){let b=0,best=null;for(const [id,l] of Object.entries(S.lifts)){const e=EXI[id];if(!e)continue;const i=musList(e,m).indexOf(m);
  const r=i===0?l.rating:i>0?Math.round(l.rating*.85):0;if(r>b){b=r;best=id}}return [best,b]}
// a staple exercise to rank an unranked muscle
const musSuggest=m=>(EXL.find(e=>e.staple&&musList(e,m)[0]===m)||EXL.find(e=>musList(e,m)[0]===m)||{}).n;
function bodyStrength(){return MUSCLES.reduce((a,m)=>a+muscleRating(m)/1000,0)/MUSCLES.length}
const muscleColor=m=>{const r=muscleRating(m);return r?rankFor(r).rank.hex:null};
// tap a muscle on the Bodygraph -> open its group in Ranks > Bodygraph
function bgTap(ev,home){const m=bodygraphHit(ev);if(!m)return;const g=MGROUPS.find(([,ms])=>ms.includes(m));if(!g)return;if(home){S.tab='ranks';S._sub='body'}S._mg=g[0];render()}
// a training day = any day with a finished workout or a logged set (e.g. home sets saved from the calculator)
function wDays(){return [...new Set([...S.sessions.map(s=>sod(s.t)),...S.history.map(h=>sod(h.t))])].sort((a,b)=>a-b)}
function curStreak(){const d=new Set(wDays());let t=sod(Date.now());if(!d.has(t))t=addDays(t,-1);let n=0;
  // planned rest days don't break a streak; a skipped training day does
  for(let k=0;k<400;k++){if(d.has(t))n++;else if(S.days.includes(new Date(t).getDay()))break;t=addDays(t,-1)}return n}
function addXP(n){S.xp+=n;while(S.xp>=100*S.level){S.xp-=100*S.level;S.level++}}
const lastFor=id=>S.last[id]||null;

/* ================= plan by date ================= */
const split=()=>splitFor(U());
function typeForDate(t){
  t=sod(t);const done=S.sessions.find(s=>sod(s.t)===t);if(done)return done.type;
  if(!S.days.includes(new Date(t).getDay()))return null;
  const today=sod(Date.now());if(t<today)return null;
  // missed days roll forward: the split only advances when a workout is finished
  let n=0;for(let x=today;x<t;x=addDays(x,1)){if(S.days.includes(new Date(x).getDay())&&!S.sessions.find(s=>sod(s.t)===x))n++}
  const sp=split();return sp[(S.splitIdx+n)%sp.length];
}
function planFor(t){
  const k=dkey(t),type=typeForDate(t);if(!type)return null;
  const program=S.goal==='lean'?'lean-top-backoff-v1':'standard-v1';let p=S.plans[k];
  if(!p||p.type!==type||p.loc!==S.loc||p.program!==program){p={type,loc:S.loc,program,seed:0,items:genDay(type,U(),S.loc,0)};S.plans[k]=p;save()}
  return p;
}
function nextTrainingLabel(){for(let k=1;k<8;k++){const t=addDays(Date.now(),k),ty=typeForDate(t);if(ty)return `${WD[new Date(t).getDay()]} · ${DAYNAME[ty]}`}return '—'}

/* coach line on Home */
function homeCoach(){
  const p=planFor(Date.now()),done=S.sessions.find(s=>sod(s.t)===sod(Date.now()));
  if(done)return `Great work today${done.ups?`: <b>${done.ups} rank-ups</b>`:''}. Eat well, sleep well. Next up: ${nextTrainingLabel()}.`;
  if(!S.sessions.length&&p)return `Welcome, ${esc(S.name||'disciple')}. Today we find your starting weights. Pick a clean weight and own every rep.`;
  if(!p)return `Rest day. Muscles grow while you recover.${curStreak()?` Your streak is <b>${curStreak()} days</b>.`:''} Next up: ${nextTrainingLabel()}.`;
  for(const it of p.items){const e=EXI[it.id],l=lastFor(it.id),c=coach(e,it,l,U(),S.lifts[it.id]?.rating);if(c.tag==='up'&&l)return `${DAYNAME[p.type]} day. <b>Add +${c.w-Math.max(...l.sets.map(s=>s.w||0))} lb</b> on ${e.n}. You earned it.`}
  return `${DAYNAME[p.type]} day. Beat your reps from last time and the rank will follow.`;
}

/* ================= quests & medals ================= */
const weekStart=()=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-d.getDay());return d.getTime()};
function QUESTS(){
  const ws=weekStart(),wk=S.history.filter(h=>h.t>=ws),wkS=S.sessions.filter(s=>s.t>=ws),today=S.sessions.filter(s=>sod(s.t)===sod(Date.now()));
  const wkDays=new Set(wkS.map(s=>sod(s.t))).size,legs=wk.filter(h=>EXI[h.ex]?.group==='legs').length,ups=wkS.reduce((a,s)=>a+(s.ups||0),0);
  return [{id:'d1',kind:'daily',ic:'flame',t:'Train today',d:'Finish a workout',p:Math.min(1,today.length),n:1,xp:50,g:3},
   {id:'w1',kind:'weekly',ic:'cal',t:`Hit ${S.days.length} training days`,d:'Complete your week',p:Math.min(S.days.length,wkDays),n:S.days.length,xp:150,g:10},
   {id:'w2',kind:'weekly',ic:'crown',t:'Rank up once',d:'Climb a division on any lift',p:Math.min(1,ups),n:1,xp:300,g:5},
   {id:'w3',kind:'weekly',ic:'dumbbell',t:"Don't skip leg day",d:'Log 6 leg sets',p:Math.min(6,legs),n:6,xp:300,g:10},
   {id:'w4',kind:'weekly',ic:'bolt',t:'Volume of a Sword Saint',d:'Log 50 sets this week',p:Math.min(50,wk.length),n:50,xp:400,g:10}];
}
const qKey=q=>q.id+'@'+(q.kind==='daily'?dkey(Date.now()):'w'+weekStart());
const claimable=()=>QUESTS().filter(q=>q.p>=q.n&&!S.claimed[qKey(q)]).length;
function claimQuest(id){const q=QUESTS().find(x=>x.id===id);if(!q||q.p<q.n||S.claimed[qKey(q)])return;S.claimed[qKey(q)]=1;S.questsDone++;addXP(q.xp);S.gems+=q.g;save();toast(`+${q.xp} XP · +${q.g} gems`);render()}
function MEDALS(){
  const w=S.sessions.length,ranked=Object.keys(S.lifts).length,bs=curStreak();
  const T=(id,ic,col,names,vals,cur,unit)=>vals.map((v,i)=>({id:id+v,ic,col,n:names[i],req:`${unit} ${v}`,cur,v}));
  return [{id:'join',ic:'bolt',col:'#4a4f9a',n:'Reincarnated',req:'Start your journey',cur:1,v:1},
   ...T('wo','dumbbell','#8a5a2a',['F-Rank Adventurer','E-Rank Adventurer','D-Rank Adventurer','C-Rank Adventurer','B-Rank Adventurer','A-Rank Adventurer','S-Rank Adventurer'],[1,5,25,50,100,250,500],w,'Workouts:'),
   ...T('st','flame','#a04512',['Morning Drills',"Swordsman's Discipline",'Mana Reservoir','Unbroken Will'],[7,30,90,365],Math.max(bs,S.bestStreak||0),'Streak:'),
   ...T('lv','spark','#4b38b8',['Apprentice Mage','Intermediate Mage','Advanced Mage','Saint Mage','King Mage'],[5,20,50,75,100],S.level,'Level:'),
   ...T('qs','scroll','#127a62',['Errand Runner','Guild Regular','Quest Board Veteran','Guild Legend'],[5,30,100,200],S.questsDone,'Quests:'),
   {id:'rk10',ic:'layers',col:'#1c5aa0',n:'Calibrated',req:'Rank 10 exercises',cur:ranked,v:10},
   {id:'pr10',ic:'crown',col:'#8a1430',n:'Breakthrough',req:'Hit 10 personal records',cur:S.prs,v:10},
   {id:'seat',ic:'award',col:'#1d6a9a',n:'Great Power',req:'Claim a Seven Great Powers seat',cur:S.seat!=null?1:0,v:1}];
}
const medalArt=(m,s=72)=>`<div class="oc" style="width:${s}px;height:${s}px;background:radial-gradient(circle at 40% 30%,${m.col},${m.col}99 60%,#0d0b13)">${I(m.ic,s*.42)}</div>`;

/* ================= sheets, toasts, reveal ================= */
function sheet(html){closeSheet();const m=document.createElement('div');m.className='modal';m.id='sheet';m.onclick=e=>{if(e.target===m)closeSheet()};
  m.innerHTML=`<div class="sheet"><div class="grab"></div>${html}</div>`;dev.appendChild(m);GodFX.scan(m)}
function closeSheet(){document.getElementById('sheet')?.remove()}
function toast(t){document.querySelector('.toast')?.remove();const e=document.createElement('div');e.className='toast';e.innerHTML=t;dev.appendChild(e);setTimeout(()=>e.remove(),2400)}
function reveal({title,sub,rank,top,btn='Continue',after}){
  const d=document.createElement('div');d.className='reveal';d.style.setProperty('--c',rank.hex);
  d.innerHTML=`<div class="rays card-in"></div><div class="eyebrow card-in slide" style="position:relative">${title}</div><div class="rn card-in slide" style="animation-delay:.08s;text-shadow:0 0 24px ${rank.hex}">${sub}</div><div class="muted card-in slide" style="position:relative;font-weight:700;margin-top:6px;animation-delay:.16s">${top||''}</div>
   <div class="mid card-in"><div class="pop">${GodFX.html(rank,200)}</div></div><button class="btn card-in" style="position:relative">${btn}</button>`;
  dev.appendChild(d);mysteryReveal(d);d.querySelector('button').onclick=()=>{d.remove();after&&after()};
}

/* ================= setup (first run) ================= */

    <div class="field" style="margin-top:6px"><label>Target bodyweight</label><input type="number" inputmode="decimal" value="${S.target}" oninput="S.target=+this.value||S.target;save()"><span class="muted">lb</span></div>`;

  return `<div class="screen">${head}<div class="body" style="display:flex;flex-direction:column;padding-top:22px">${b}</div><div style="padding:0 18px calc(18px + var(--sb))">${cta}</div></div>`;

function tglDay(i){const a=S.days,j=a.indexOf(i);if(j>=0){if(a.length<=2){toast('Pick at least 2 days');return}a.splice(j,1)}else a.push(i);a.sort();S.plans={};save();render()}

/* ================= HOME ================= */

     <button class="row" onclick="S.tab='ranks';render()" style="gap:8px">${rf?fx(rf.rank,40):''}<div style="text-align:right"><div class="eyebrow" style="font-size:9.5px">Overall</div><div style="font-weight:800;font-size:13px;color:${rf?rf.rank.hex:'var(--muted)'}">${rf?rf.rank.name+' '+rf.div:'Unranked'}</div></div></button></div></div>

      <div class="legend" style="margin-top:6px">${RANKS.map(r=>`<span><i style="background:${r.hex}"></i>${r.name.replace(' God','')}</span>`).join('')}</div></div>

     :p?`<div class="card"><div class="between"><div><div class="eyebrow">Today · ${WD[new Date().getDay()]}</div><div class="h2" style="margin-top:2px">${DAYNAME[p.type]}</div></div><span class="pill">${p.items.length} exercises · ${p.items.reduce((a,b)=>a+b.sets,0)} sets</span></div>
        <div class="chips" style="margin:12px 0">${[...glow].map(m=>`<span class="chip">${MUSCLE_NAMES[m]}</span>`).join('')}</div>
        <div class="row"><button class="btn ghost" style="flex:1" onclick="S.tab='plan';S._sel=null;render()">View plan</button><button class="btn" style="flex:1.3" onclick="startWorkout()">${I('play',16)} Start</button></div></div>`

    <div class="card"><div class="between"><div><div class="eyebrow">Bodyweight goal</div><div class="h2 num" style="margin-top:2px">${cur} <span class="muted" style="font-size:14px">lb</span></div></div>
      <div style="text-align:right"><div class="eyebrow">Target</div><div style="font-weight:800">${S.target} lb</div><div class="muted" style="font-size:12px">${toGo===0?'Reached':Math.abs(toGo)+' lb to '+(toGo>0?'lose':'gain')}</div></div></div>
      ${lineChart(pts.slice(-20),S.target)}<button class="btn ghost sm" style="width:100%;margin-top:10px" onclick="logWeight()">${I('scale',16)} Log weight</button></div>

function lineChart(pts,target,h=110){
  if(pts.length<2)return `<div class="muted" style="font-size:12px;padding:14px 0 2px">Log your weight a few times to see your trend.</div>`;
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]).concat(target?[target]:[]),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys)-1,y1=Math.max(...ys)+1;
  const X=x=>8+(x-x0)/((x1-x0)||1)*284,Y=y=>h-10-(y-y0)/((y1-y0)||1)*(h-22);const d=pts.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join(' ');
  return `<svg viewBox="0 0 300 ${h}" width="100%" style="margin-top:10px"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc4ff" stop-opacity=".35"/><stop offset="1" stop-color="#7cc4ff" stop-opacity="0"/></linearGradient></defs>
   ${target?`<line x1="0" x2="300" y1="${Y(target)}" y2="${Y(target)}" stroke="#e9c46a" stroke-dasharray="4 5" stroke-width="1.2"/><text x="296" y="${Y(target)-5}" text-anchor="end" fill="#e9c46a" font-size="10" font-weight="700">${target}</text>`:''}
   <path d="${d} L${X(x1)} ${h} L${X(x0)} ${h}Z" fill="url(#lg)"/><path d="${d}" fill="none" stroke="#7cc4ff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
   <circle cx="${X(pts.at(-1)[0])}" cy="${Y(pts.at(-1)[1])}" r="4" fill="#fff"/></svg>`;
}
function logWeight(){sheet(`<div class="h2">Log bodyweight</div><p class="muted" style="margin:4px 0 14px;font-size:13px">Updates your ranks and starting weights.</p>
  <div class="field"><label>Weight</label><input id="lw" type="number" inputmode="decimal" value="${S.bw}"><span class="muted">lb</span></div>
  <button class="btn" onclick="const v=+$('#lw').value;if(v>50){S.health.push({t:Date.now(),weight:v});S.bw=v;save();closeSheet();toast('Weight logged');render()}">Save</button>`)}

/* ================= PLAN ================= */
function planView(){
  const today=sod(Date.now()),ws=addDays(today,-new Date(today).getDay()),sel=S._sel??today;
  const days=[...Array(7)].map((_,i)=>addDays(ws,i));
  const strip=days.map(t=>{const ty=typeForDate(t),done=S.sessions.find(s=>sod(s.t)===t);
    return `<button class="wd ${ty?'train':'rest'} ${done?'done':''} ${t===sel?'sel':''}" onclick="S._sel=${t};render()"><span>${WD[new Date(t).getDay()]}</span><b>${new Date(t).getDate()}</b><i>${done?'Done':ty?(DAYNAME[ty].split(' ')[0]):'Rest'}</i></button>`}).join('');
  const done=S.sessions.find(s=>sod(s.t)===sel),past=sel<today;
  let b='';
  if(done)b=`<div class="card"><div class="between"><div><div class="eyebrow">${new Date(sel).toLocaleDateString(undefined,{weekday:'long'})}</div><div class="h2">${DAYNAME[done.type]||'Workout'}</div></div><span style="color:var(--good)">${I('check',26)}</span></div>
     ${done.items.map(it=>{const e=EXI[it.id];return `<div class="between" style="padding:9px 0;border-bottom:1px solid var(--line);font-size:14px"><span>${e.n}</span><span class="muted num">${it.sets.map(s=>(s.w?s.w+'×':'')+s.r).join('  ')}</span></div>`}).join('')}</div>`;
  else if(past)b=`<div class="card muted">Nothing logged this day.</div>`;
  else{
    const p=planFor(sel);
    if(!p)b=`<div class="card"><div class="h2">Rest day</div><p class="muted" style="margin-top:6px">Recovery is part of the plan. Next: ${nextTrainingLabel()}</p></div>`;
    else{
      const tot=p.items.reduce((a,b)=>a+b.sets,0);
      b=`<div class="between" style="margin:4px 2px 12px"><div><div class="eyebrow">${new Date(sel).toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})}</div><div class="h1" style="font-size:26px">${DAYNAME[p.type]}</div></div>
          <div class="seg" style="width:140px">${[['gym','Gym'],['home','Home']].map(([k,l])=>`<button class="${p.loc===k?'on':''}" onclick="setLoc('${k}')">${l}</button>`).join('')}</div></div>
        <div class="row" style="margin-bottom:12px;gap:8px;flex-wrap:wrap"><span class="pill">${p.items.length} exercises</span><span class="pill">${tot} sets</span><span class="pill">${({lean:'Lean muscle',strength:'Strength',fat:'Fat loss',recomp:'Recomp'})[S.goal]}</span></div>
        ${p.program==='lean-top-backoff-v1'?`<p class="dim" style="font-size:12px;line-height:1.45;margin:0 2px 12px">Each exercise starts with one hard 5–8-rep top set, followed by a lighter 6–8-rep back-off set. Keep form controlled; an extra back-off set is added only if your top set is below five reps.</p>`:''}
        ${p.items.map((it,i)=>{const e=EXI[it.id],c=coach(e,it,lastFor(it.id),U(),S.lifts[it.id]?.rating),r=S.lifts[it.id];const scheme=it.style==='top-backoff'?`Top ${it.lo}–${it.hi} · back-off ${it.backoffLo}–${it.backoffHi}`:`${it.sets} × ${it.lo}–${it.hi}`;
          return `<div class="ex"><button onclick="exSheet('${e.id}')" class="row" style="flex:1;min-width:0;text-align:left;gap:12px">${thumb(e,44)}
             <span class="t"><b>${e.n}</b><small>${scheme}${e.type==='time'?'s':''} · ${e.type==='w'?c.w+' lb':e.eqName}</small></span></button>
            <button class="ibtn ${it.locked?'on':''}" onclick="lockItem(${i})" aria-label="Lock">${I(it.locked?'lock':'unlock',17)}</button><button class="ibtn" onclick="swapItem(${i})" aria-label="Swap">${I('swap',17)}</button></div>`}).join('')}
        <div class="row" style="margin-top:12px"><button class="btn ghost" style="flex:1" onclick="reroll()">${I('dice',18)} Randomize</button>
          <button class="btn" style="flex:1.3" ${sel!==today?'disabled':''} onclick="startWorkout()">${sel===today?'Continue':'Opens '+WD[new Date(sel).getDay()]}</button></div>
        <p class="dim" style="font-size:12px;text-align:center;margin-top:10px">Lock the ones you like, then roll the dice for the rest.</p>`;
    }
  }
  return `<div class="top"><div><div class="eyebrow">${splitName(U())}</div><div class="h2">Your plan</div></div><button class="ibtn" onclick="S.tab='profile';S._page='settings';render()">${I('gear')}</button></div>
   <div class="body"><div class="week" style="margin-bottom:16px">${strip}</div>${b}</div>`;
}
const curPlan=()=>planFor(S._sel??sod(Date.now()));
function setLoc(l){S.loc=l;save();render()}
function lockItem(i){const p=curPlan();p.items[i].locked=!p.items[i].locked;save();render()}
function reroll(){const p=curPlan();p.seed=(p.seed||0)+1+Math.floor(Math.random()*1000);const keep={};p.items.forEach(it=>{if(it.locked)keep[it.slot]=it.id});
  p.items=genDay(p.type,U(),p.loc,p.seed,keep);p.items.forEach(it=>{if(keep[it.slot]===it.id)it.locked=true});save();render()}
function swapItem(i){const p=curPlan(),it=p.items[i];const opts=swapOptions(p.type,U(),p.loc,it.slot,p.items.map(x=>x.id)).slice(0,40);
  sheet(`<div class="h2">Swap ${esc(EXI[it.id].n)}</div><p class="muted" style="font-size:13px;margin:4px 0 12px">Choose one of the recommendations or search the full exercise library.</p>
   <button class="btn" style="width:100%;margin-bottom:14px" onclick="openPicker('swap',${i})">${I('search',16)} Search all ${EXL.length} exercises</button>
   <div class="eyebrow" style="margin:0 2px 6px">Recommended swaps</div>
   ${opts.map(e=>`<button class="ex" onclick="doSwap(${i},'${e.id}')"><span class="t"><b>${e.n}</b><small>${e.eqName} · ${e.m.map(m=>MUSCLE_NAMES[m]).join(', ')}</small></span>${e.staple?'<span class="tag">Staple</span>':''}</button>`).join('')}`)}
function doSwap(i,id){const p=curPlan();p.items[i].id=id;p.items[i].locked=true;save();closeSheet();render()}

/* ================= WORKOUT ================= */
function startWorkout(){
  const p=planFor(Date.now());if(!p){toast('Rest day today');return}
  S.active={t:Date.now(),type:p.type,ups:0,prs:0,items:p.items.map(it=>{const e=EXI[it.id],c=coach(e,it,lastFor(it.id),U(),S.lifts[it.id]?.rating);
    return {id:it.id,lo:it.lo,hi:it.hi,backoffLo:it.backoffLo,backoffHi:it.backoffHi,style:it.style,coach:c,sets:[...Array(it.sets)].map((_,setIndex)=>{const backoff=it.style==='top-backoff'&&setIndex===1;return {w:e.type==='w'?(backoff?(c.backoffW??c.w):c.w):'',r:'',done:false,role:it.style==='top-backoff'?(backoff?'backoff':'top'):'work',target:backoff?(c.backoffR??it.backoffLo??it.lo):c.r}})}})};
  save();render();
}
function workoutView(){
  const a=S.active,done=a.items.reduce((n,i)=>n+i.sets.filter(s=>s.done).length,0),tot=a.items.reduce((n,i)=>n+i.sets.length,0);
  return `<div class="screen"><div class="top"><button class="ibtn" onclick="exitWorkout()">${I('x')}</button><div style="text-align:center"><div class="eyebrow">In progress</div><div class="h3">${DAYNAME[a.type]}</div></div><span class="pill num">${done}/${tot}</span></div>
   <div class="prog" style="margin:0 18px 10px"><i style="width:${done/tot*100}%"></i></div>
   <div class="body" id="wbody">${a.items.map((it,i)=>exCard(it,i)).join('')}
    <button class="btn" style="margin-top:6px" onclick="finishWorkout()">${I('check',18)} Finish workout</button></div></div>`;
}
function exCard(it,i){

  return `<div class="card" id="ex${i}">
   <div class="between"><button class="row" style="text-align:left;min-width:0" onclick="exSheet('${e.id}')">${thumb(e,46)}<span style="min-width:0"><b style="font-size:16px;display:block">${e.n}</b><small class="muted" style="font-size:12px">${range} ${rl} · ${rf?`<span style="color:${rf.rank.hex}">${rf.rank.name} ${rf.div}</span>`:'Unranked'}</small></span></button>
     <button class="ibtn" onclick="exSheet('${e.id}')">${I('info',18)}</button></div>
   <div class="coach sm" style="margin-top:12px"><img src="${COACH_IMG}" alt=""><div class="bubble">${msg}</div></div>

function mysteryReveal(d,after){

     <div class="field"><label>Bodyweight</label><input type="number" inputmode="decimal" value="${S.bw}" onchange="S.bw=+this.value||S.bw;S.health.push({t:Date.now(),weight:S.bw});save()"><span class="muted">lb</span></div>
     <div class="field"><label>Target weight</label><input type="number" inputmode="decimal" value="${S.target}" onchange="S.target=+this.value||S.target;save()"><span class="muted">lb</span></div>
     <div class="field"><label>Age</label><input type="number" value="${S.age}" onchange="S.age=+this.value||S.age;save()"></div>
     <div class="seg" style="margin-bottom:16px">${[['m','Male'],['f','Female']].map(([k,l])=>`<button class="${S.sex===k?'on':''}" onclick="S.sex='${k}';save();render()">${l}</button>`).join('')}</div>
     <div class="eyebrow" style="margin:4px 0 8px">Training</div>
     <div class="field"><label>Goal</label><select onchange="S.goal=this.value;S.plans={};save();render()">${[['lean','Build lean muscle'],['strength','Get stronger'],['fat','Lose fat'],['recomp','Recomp']].map(([k,l])=>`<option value="${k}" ${S.goal===k?'selected':''}>${l}</option>`).join('')}</select></div>
     <div class="field"><label>Experience</label><select onchange="S.exp=this.value;S.plans={};save();render()">${[['beg','Beginner'],['int','Intermediate'],['adv','Advanced']].map(([k,l])=>`<option value="${k}" ${S.exp===k?'selected':''}>${l}</option>`).join('')}</select></div>
     <div class="field"><label>Default location</label><select onchange="S.loc=this.value;S.plans={};save();render()">${[['gym','Gym'],['home','Home']].map(([k,l])=>`<option value="${k}" ${S.loc===k?'selected':''}>${l}</option>`).join('')}</select></div>
     <div class="eyebrow" style="margin:14px 0 8px">Training days · ${splitName(U())}</div>
     <div class="week">${WD.map((d,i)=>`<button class="wd ${S.days.includes(i)?'done':''}" style="padding:12px 0" onclick="tglDay(${i})"><b>${d[0]}</b><i>${d}</i></button>`).join('')}</div>
     ${remindersCard()}
     <div class="eyebrow" style="margin:18px 0 8px">Look</div>
     <div class="field"><label>Void background</label><button onclick="S.voidOff=!S.voidOff;VoidBG.set(!S.voidOff);save();render()" style="width:52px;height:30px;border-radius:999px;position:relative;background:${!S.voidOff?'linear-gradient(135deg,#9ad3ff,#5b8dff)':'#2a2438'}"><span style="position:absolute;top:3px;${!S.voidOff?'right:3px':'left:3px'};width:24px;height:24px;border-radius:50%;background:#fff"></span></button></div>
     <button class="btn ghost" style="margin-top:24px;color:var(--bad)" onclick="if(confirm('Erase everything and start over?')){localStorage.removeItem('godrank2');S=load();render()}">${I('trash',16)} Reset app</button>`}
  if(p==='streak')b=streakPage();
  if(p==='quests'){const row=q=>{const done=S.claimed[qKey(q)];return `<div class="ex"><span class="ibtn">${I(q.ic,18)}</span><span class="t"><b>${q.t}</b><small>${q.d} · +${q.xp} XP · +${q.g} gems</small><div class="bar" style="height:5px;margin-top:6px"><i style="width:${q.p/q.n*100}%"></i></div></span><button class="btn sm ${q.p>=q.n&&!done?'':'ghost'}" style="padding:8px 12px;font-size:12px" ${q.p>=q.n&&!done?`onclick="claimQuest('${q.id}')"`:'disabled'}>${done?'Done':'Claim'}</button></div>`};
    const qs=QUESTS();b=`<div class="eyebrow" style="margin:4px 0 8px">Daily</div>${qs.filter(q=>q.kind==='daily').map(row).join('')}<div class="eyebrow" style="margin:16px 0 8px">Weekly</div>${qs.filter(q=>q.kind==='weekly').map(row).join('')}<p class="dim" style="font-size:12px;margin-top:8px">Quests completed: ${S.questsDone}</p>`}
  if(p==='medals'){const ms=MEDALS();b=`<p class="muted" style="font-size:13px;margin-bottom:14px">${ms.filter(m=>m.cur>=m.v).length} of ${ms.length} earned</p><div class="mgrid">${ms.map(m=>`<div class="medal ${m.cur>=m.v?'':'lock'}">${medalArt(m)}${m.n}<div class="dim" style="font-size:10px;font-weight:600;margin-top:2px">${m.req}</div></div>`).join('')}</div>`}
  if(p==='goals')b=`${S.goals.map((g,i)=>goalCard(g,i)).join('')}<div class="eyebrow" style="margin:10px 0 8px">Create a goal</div>
    ${[['strength','Strength','Hit a target 1RM on a lift','dumbbell'],['bodyweight','Bodyweight','Reach your target weight','scale'],['consistency','Consistency','Train a set number of days each week','flame']].map(([k,t,d,ic])=>`<button class="opt" onclick="newGoal('${k}')"><span class="ibtn">${I(ic,18)}</span><span style="flex:1"><b>${t}</b><small>${d}</small></span>${I('right',18)}</button>`).join('')}`;
  if(p==='health'){const met=S._met||'weight',pts=S.health.filter(h=>h[met]).map(h=>[h.t,h[met]]),last=[...S.health].reverse();
    b=`<div class="chips" style="margin-bottom:10px">${MEAS.map(([k,l])=>`<button class="chip ${met===k?'on':''}" onclick="S._met='${k}';render()">${l}</button>`).join('')}</div><div class="card">${lineChart(pts,met==='weight'?S.target:null)}</div>
     <div class="card"><div class="h3" style="margin-bottom:10px">Log measurements</div>${MEAS.map(([k,l,u])=>`<div class="field"><label>${l}</label><input id="m_${k}" type="number" inputmode="decimal" placeholder="${(last.find(h=>h[k])||{})[k]??''}"><span class="muted">${u}</span></div>`).join('')}
      <button class="btn" onclick="saveHealth()">Save</button></div>`}
  if(p==='library'){const g=S._lgrp||'chest',q=(S._q||'').toLowerCase(),list=EXL.filter(e=>(q?e.n.toLowerCase().includes(q):e.group===g)&&(S._lloc!=='home'||e.home));
    b=`<div class="field">${I('search',18)}<input id="libq" style="width:100%;text-align:left" placeholder="Search ${EXL.length} exercises" value="${esc(S._q||'')}" oninput="S._q=this.value;clearTimeout(window._qt);window._qt=setTimeout(()=>{render();const x=$('#libq');x&&(x.focus(),x.setSelectionRange(x.value.length,x.value.length))},250)"></div>
     <div class="chips" style="margin-bottom:8px">${['chest','back','shoulders','arms','legs','core'].map(k=>`<button class="chip ${g===k&&!q?'on':''}" onclick="S._lgrp='${k}';S._q='';render()">${k[0].toUpperCase()+k.slice(1)} · ${EXL.filter(e=>e.group===k).length}</button>`).join('')}</div>
     <div class="seg" style="margin-bottom:12px">${[['all','All'],['home','Home only']].map(([k,l])=>`<button class="${(S._lloc||'all')===k?'on':''}" onclick="S._lloc='${k}';render()">${l}</button>`).join('')}</div>
     ${list.map(e=>{const l=S.lifts[e.id],rf=l?rankFor(l.rating):null;return `<button class="ex" onclick="exSheet('${e.id}')">${thumb(e,46)}<span class="t"><b>${e.n}</b><small>${e.eqName} · ${e.m.map(m=>MUSCLE_NAMES[m]).join(', ')}</small></span>${rf?fx(rf.rank,32):e.staple?'<span class="tag">Staple</span>':''}</button>`}).join('')||'<p class="muted">No matches.</p>'}`}
  return `<div class="top"><button class="ibtn" onclick="S._page=null;render()">${I('left')}</button><div class="h2">${title}</div><span style="width:38px"></span></div><div class="body">${b}</div>`;
}
function saveHealth(){const e={t:Date.now()};let any=0;for(const[k] of MEAS){const v=parseFloat($('#m_'+k)?.value);if(v>0){e[k]=v;any=1}}if(!any){toast('Enter at least one measurement');return}S.health.push(e);if(e.weight)S.bw=e.weight;save();toast('Saved');render()}

/* ================= floating coach ================= */
function coachLine(){
  if(S.active){const it=S.active.items.find(i=>i.sets.some(x=>!x.done));if(!it)return 'All sets done. Hit <b>Finish workout</b> and claim your XP.';const e=EXI[it.id];
    return `<b>${e.n}</b>: ${it.coach.msg}`}
  const tab=S.tab||'home',n=Object.keys(S.lifts).length;
  if(tab==='ranks'){if(n<PLACE)return `Rank <b>${PLACE-n} more exercises</b> to lock in your god rank. Log your home sets in the <b>Calculator</b>.`;
    let best=null;for(const [id,l] of Object.entries(S.lifts)){const e=EXI[id];if(!e)continue;const k=rankFor(l.rating);if(!best||k.lp>best.k.lp)best={e,l,k}}
    if(best){const h=rankHint(best.e,best.l.rating,best.l.r,U());return `You're close on <b>${best.e.n}</b>. Hit <b>${h.txt}</b> for ${h.nr.rank.name} ${h.nr.div}.`}}
  if(tab==='profile'){const c=curStreak();return c?`<b>${c}-day streak.</b> Don't let the flame go out. Next: ${nextTrainingLabel()}.`:'Start a streak today. Every training day you show up keeps the flame alive.'}
  return homeCoach();
}
// Rudeus pops in only when he has something new to say; tapping him fades him out until the message changes
function coachEl(){const line=coachLine(),key=line.replace(/<[^>]+>/g,'');
  if((S.seenCoach||[]).includes(key))return '';
  return `<div class="fcoach ${S.active?'wk':''}" id="fcoach" onclick="dismissCoach()"><div class="fb"><span class="nm">Coach Rudeus · tap to close</span>${line}</div>
   <button class="av" aria-label="Close coach"><img src="${COACH_IMG}" alt="Rudeus"></button></div>`}
function dismissCoach(){const el=$('#fcoach');const key=coachLine().replace(/<[^>]+>/g,'');(S.seenCoach||=[]).push(key);if(S.seenCoach.length>60)S.seenCoach.splice(0,20);save();
  if(el){el.style.transition='opacity .35s, transform .35s';el.style.opacity=0;el.style.transform='translateY(10px) scale(.96)';setTimeout(()=>el.remove(),360)}}

/* ================= shell & render ================= */
function render(){
  // the lava in the background glows in your current god-rank color
  {const o=overall();VoidBG.color(o?rankFor(o).rank.hex:'#ff5a2a');VoidBG.level(bodyStrength())}
  if(!S.setup){root.innerHTML=setupView();GodFX.scan(root);return}
  if(S.active){root.innerHTML=workoutView()+coachEl();GodFX.scan(root);return}
  const tab=S.tab||'home',view=S._page==='picker'?pickerView():{home:homeView,plan:planView,ranks:ranksView,profile:profileView}[tab]();
  const key=tab+(S._page||''),anim=key!==render.last?'fade':'';render.last=key;
  root.innerHTML=`<div class="screen ${anim}">${view}<nav class="tabbar">${[['home','home','Home'],['plan','plan','Plan'],['ranks','trophy','Ranks'],['profile','user','Profile']].map(([k,ic,l])=>`<button class="${tab===k?'on':''}" onclick="S.tab='${k}';S._page=null;${k==='plan'?'S._sel=null;':''}save();render()">${I(ic,22)}${l}</button>`).join('')}</nav>${coachEl()}</div>`;
  GodFX.scan(root);
}
VoidBG.mount(dev);VoidBG.set(!S.voidOff);
render();
</script>
<script>if('serviceWorker' in navigator&&isSecureContext)navigator.serviceWorker.register('sw.js')</script>
</body>
</html>
