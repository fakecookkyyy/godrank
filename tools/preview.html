<!doctype html><html><body style="margin:0;background:#0b0a10;color:#fff;font:12px sans-serif">
<!-- Dev preview of the muscle map: serve the repo (python3 -m http.server) and open /tools/preview.html?m=ranked|gray|mixed|front|back|focus -->
<script src="../badges.js"></script><script src="../anatomy-shapes.js"></script><script src="../anatomy.js"></script>
<div id="o"></div>
<script>
const q=new URLSearchParams(location.search),mode=q.get('m')||'ranked';
const R=window.RANKS.map(r=>r.hex);
const rank={chest:R[3],shoulders:R[4],traps:R[2],biceps:R[5],triceps:R[6],forearms:R[0],core:R[6],back:R[3],glutes:R[1],quads:R[5],hams:R[2],calves:R[0]};
let h='';
if(mode==='ranked')h=anatomy({colorOf:m=>rank[m],height:900});
if(mode==='gray')h=anatomy({colorOf:()=>null,height:900});
if(mode==='mixed')h=anatomy({colorOf:m=>['chest','shoulders','biceps','quads'].includes(m)?R[4]:null,glow:new Set(['chest']),height:900});
if(mode==='front')h=anatomy({colorOf:m=>rank[m],view:'front',height:1000});
if(mode==='back')h=anatomy({colorOf:m=>rank[m],view:'back',height:1000});
if(mode==='focus')h=MUSCLES.map(m=>`<span style="display:inline-block;width:110px;height:110px;margin:4px;background:#000;border-radius:12px;overflow:hidden">${anatomy({colorOf:x=>x===m?'#7cc4ff':null,focus:m,height:110})}</span>`).join('');
document.getElementById('o').innerHTML=h;
</script></body></html>
